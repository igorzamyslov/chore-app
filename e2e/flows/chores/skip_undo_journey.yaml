# Skip → snackbar tells where it went → Undo brings it back (ux-round-2 A4).
appId: ${APP_ID}
tags:
  - happy
---
- launchApp:
    clearState: true
# First-frame settle (README convention 8): on slow CI machines the
# first frame after a clearState launch can lose the race against the
# first tap — wait for the welcome gate to exist before touching anything
# (a cold launch now lands there, spec docs/specs/onboarding-v2.md, not on
# the shell directly).
- extendedWaitUntil:
    visible:
      id: "welcome.create"
    timeout: 60000
- runFlow: ../../common/onboard_fresh.yaml
- tapOn:
    id: "chores.add"
- tapOn:
    id: "chore_form.title"
- inputText: "Mop kitchen"
- pressKey: Enter
- tapOn:
    id: "chore_form.repeat.toggle"
# The repeat rule is one fill-in-the-blank sentence now, and the unit is a
# menu hole in it rather than a segmented control (G-2,
# docs/plans/2026-08-18-repeat-form-sentence.md). The
# chore_form.repeat.unit.<day|week|month> ids are unchanged -- they moved
# into the menu -- so reaching them takes an extra tap to open it.
- tapOn:
    id: "chore_form.repeat.unit"
- tapOn:
    id: "chore_form.repeat.unit.day"
- tapOn:
    id: "chore_form.save"
- assertVisible:
    id: "chores.add"
# Settle proof before touching the tile: on slow CI simulators the row is
# still animating in right after save, and a menu tap during the animation
# misses (first live CI run failed exactly here). The FAB assert above only
# proves we left the form; this proves the tile is rendered.
- assertVisible: "(?s).*Mop kitchen.*"
# Skip via the tile menu.
- tapOn:
    id: 'chores\.occurrence\..*\.menu'
- tapOn:
    id: "chores.menu.skip"
# The snackbar explains where the chore went...
- assertVisible: "Skipped — next due tomorrow"
# ...and Undo restores it to Today.
- tapOn: "Undo"
- assertVisible:
    id: "chores.section.today"
- assertVisible: "(?s).*Mop kitchen.*"
# The Done-today section is gone again (the skip was undone).
- assertNotVisible:
    id: "chores.done.header"
