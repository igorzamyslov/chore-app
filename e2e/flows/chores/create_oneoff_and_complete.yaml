# Happy path: create a one-off chore due today, complete it, list empties.
appId: ${APP_ID}
tags:
  - happy
---
- launchApp:
    clearState: true
# First-frame settle (README convention 8): on slow CI machines the
# first frame after a clearState launch can lose the race against the
# first tap — wait for the shell to exist before touching anything.
- extendedWaitUntil:
    visible:
      id: "shell.tab.chores"
    timeout: 60000
- tapOn:
    id: "chores.add"
- tapOn:
    id: "chore_form.title"
- inputText: "Water plants"
- pressKey: Enter
- tapOn:
    id: "chore_form.save"
- assertVisible: "(?s).*Water plants.*"
- assertVisible: "Today"
- tapOn:
    id: 'chores\.occurrence\..*\.complete'
- assertVisible:
    id: "chores.empty"
