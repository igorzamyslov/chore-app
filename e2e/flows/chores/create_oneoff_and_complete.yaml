# Happy path: create a one-off chore due today, complete it, list empties.
appId: ${APP_ID}
tags:
  - happy
---
- launchApp:
    clearState: true
- tapOn:
    id: "chores.add"
- tapOn:
    id: "chore_form.title"
- inputText: "Water plants"
- pressKey: Enter
- tapOn:
    id: "chore_form.save"
- assertVisible: "(?s).*Water plants.*"
- assertVisible: "Today"
- tapOn:
    id: 'chores\.occurrence\..*\.complete'
- assertVisible:
    id: "chores.empty"
