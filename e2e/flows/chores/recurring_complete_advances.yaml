# Recurrence journey: a daily recurring chore, once completed, comes back
# due tomorrow (next occurrence generated by the lifecycle service).
appId: ${APP_ID}
tags:
  - happy
---
- launchApp:
    clearState: true
- tapOn:
    id: "chores.add"
- tapOn:
    id: "chore_form.title"
- inputText: "Feed the cat"
- tapOn:
    id: "chore_form.repeat.toggle"
- assertVisible:
    id: "chore_form.repeat.unit.day"
- tapOn:
    id: "chore_form.save"
- assertVisible: "Today"
- tapOn:
    id: "chores\.occurrence\..*\.complete"
# Not gone — moved to Tomorrow.
- assertVisible: "Tomorrow"
- assertVisible: "Feed the cat"
- assertNotVisible: "Today"
