# Recurrence journey: a daily recurring chore, once completed, comes back
# due tomorrow (next occurrence generated by the lifecycle service).
appId: ${APP_ID}
tags:
  - happy
---
- launchApp:
    clearState: true
# First-frame settle (README convention 8): on slow CI machines the
# first frame after a clearState launch can lose the race against the
# first tap — wait for the welcome gate to exist before touching anything
# (a cold launch now lands there, spec docs/specs/onboarding-v2.md, not on
# the shell directly).
- extendedWaitUntil:
    visible:
      id: "welcome.create"
    timeout: 60000
- runFlow: ../../common/onboard_fresh.yaml
- tapOn:
    id: "chores.add"
- tapOn:
    id: "chore_form.title"
- inputText: "Feed the cat"
- pressKey: Enter
- tapOn:
    id: "chore_form.repeat.toggle"
# The form's smart default is weekly-on-today's-weekday; this journey
# needs a DAILY rule so completion moves the chore to Tomorrow.
#
# The repeat rule is one fill-in-the-blank sentence now, and the unit is a
# menu hole in it rather than a segmented control (G-2,
# docs/plans/2026-08-18-repeat-form-sentence.md). The
# chore_form.repeat.unit.<day|week|month> ids are unchanged -- they moved
# into the menu -- so reaching them takes an extra tap to open it.
- tapOn:
    id: "chore_form.repeat.unit"
- tapOn:
    id: "chore_form.repeat.unit.day"
- tapOn:
    id: "chore_form.save"
- assertVisible:
    id: "chores.section.today"
- tapOn:
    id: 'chores\.occurrence\..*\.complete'
# Not gone — moved to Tomorrow.
- assertVisible:
    id: "chores.section.tomorrow"
- assertVisible: "(?s).*Feed the cat.*"
- assertNotVisible:
    id: "chores.section.today"
