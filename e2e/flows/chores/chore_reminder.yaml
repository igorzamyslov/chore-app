# Per-chore reminder (spec docs/specs/notifications-n2.md §2.1 / AC1): set
# one, save, reopen the chore, and find it still on.
#
# §13.3 accepts that no CI job puts a real notification on a real device and
# carves out exactly this: E2E covers the SETTINGS surfaces, "enabling a
# chore reminder and seeing it persist". The reopen-and-assert is the whole
# point of the flow -- it is the only automated check in this slice that the
# value survives a real save/load round trip on a real Android build, which
# is the half a widget test's in-memory database cannot vouch for.
appId: ${APP_ID}
tags:
  - happy
---
- launchApp:
    clearState: true
# First-frame settle (README convention 8): on slow CI machines the
# first frame after a clearState launch can lose the race against the
# first tap — wait for the welcome gate to exist before touching anything
# (a cold launch now lands there, spec docs/specs/onboarding-v2.md, not on
# the shell directly).
- extendedWaitUntil:
    visible:
      id: "welcome.create"
    timeout: 60000
- runFlow: ../../common/onboard_fresh.yaml
- tapOn:
    id: "chores.add"
- tapOn:
    id: "chore_form.title"
- inputText: "Bins out"
# Enter rather than hideKeyboard (README convention 3): a blind gesture on
# iOS can tap random controls.
- pressKey: Enter
# Off by default -- the reminder is opt-in, and the time card only exists
# once the switch is on.
- assertNotVisible:
    id: "chore_form.reminder.time"
- tapOn:
    id: "chore_form.reminder.toggle"
- assertVisible:
    id: "chore_form.reminder.time"
- tapOn:
    id: "chore_form.save"
# Assert we actually LEFT the form via an element that only exists on the
# list (README convention 4), then the tile's own text before touching it
# (convention 6): the row is still animating in right after save on slow CI
# devices. The tile merges title + metadata into one accessibility node, so
# this is a substring regex (convention 8).
- assertVisible:
    id: "chores.add"
- assertVisible: "(?s).*Bins out.*"
# Reopen the same chore through its row menu. Regex id in SINGLE quotes
# (convention 1) because the occurrence id is a UUID.
- tapOn:
    id: 'chores\.occurrence\..*\.menu'
- tapOn:
    id: "chores.menu.edit"
# The round trip this flow exists for: the form loaded the stored
# reminder_minutes back off a real device database, so the switch is on and
# its time card is on screen again.
- assertVisible:
    id: "chore_form.reminder.time"
