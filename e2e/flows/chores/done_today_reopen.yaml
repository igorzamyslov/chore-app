# Complete → appears under 'Done today' → Reopen restores it (ux-round-2 A3).
appId: ${APP_ID}
tags:
  - happy
---
- launchApp:
    clearState: true
# First-frame settle (README convention 8): on slow CI machines the
# first frame after a clearState launch can lose the race against the
# first tap — wait for the welcome gate to exist before touching anything
# (a cold launch now lands there, spec docs/specs/onboarding-v2.md, not on
# the shell directly).
- extendedWaitUntil:
    visible:
      id: "welcome.create"
    timeout: 60000
- runFlow: ../../common/onboard_fresh.yaml
- tapOn:
    id: "chores.add"
- tapOn:
    id: "chore_form.title"
- inputText: "Dust shelves"
- pressKey: Enter
- tapOn:
    id: "chore_form.save"
- assertVisible:
    id: "chores.add"
- tapOn:
    id: 'chores\.occurrence\..*\.complete'
# One-off chore completed: list empty, but it lives in Done today.
- tapOn:
    id: "chores.done.header"
- assertVisible: "(?s).*Dust shelves.*"
# Reopen it from the section.
- tapOn:
    id: 'chores\.done\..*\.reopen'
- assertVisible:
    id: "chores.section.today"
- assertVisible: "(?s).*Dust shelves.*"
- assertNotVisible:
    id: "chores.done.header"
