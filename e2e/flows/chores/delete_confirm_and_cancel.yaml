# Destructive action: delete asks for confirmation; cancel keeps the chore,
# confirm removes it.
appId: ${APP_ID}
tags:
  - error
---
- launchApp:
    clearState: true
# First-frame settle (README convention 8): on slow CI machines the
# first frame after a clearState launch can lose the race against the
# first tap — wait for the shell to exist before touching anything.
- extendedWaitUntil:
    visible:
      id: "shell.tab.chores"
    timeout: 60000
- tapOn:
    id: "chores.add"
- tapOn:
    id: "chore_form.title"
- inputText: "Clean windows"
- pressKey: Enter
- tapOn:
    id: "chore_form.save"
- assertVisible: "(?s).*Clean windows.*"
# Cancel path.
- tapOn:
    id: 'chores\.occurrence\..*\.menu'
- tapOn:
    id: "chores.menu.delete"
- tapOn:
    id: "chores.delete.cancel"
- assertVisible: "(?s).*Clean windows.*"
# Confirm path.
- tapOn:
    id: 'chores\.occurrence\..*\.menu'
- tapOn:
    id: "chores.menu.delete"
- tapOn:
    id: "chores.delete.confirm"
- assertVisible:
    id: "chores.empty"
