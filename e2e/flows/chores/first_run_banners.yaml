# First-run banners journey (spec docs/specs/polish-round-1.md A2/A3):
# a fresh launch shows the name-prompt banner; setting a name via the
# EXISTING member edit sheet dismisses it; adding the first chore then
# surfaces the digest pre-prompt banner (OS notification permission isn't
# granted yet on a freshly-cleared install), dismissed via its own action.
# Both are inline banner cards, never modals, so this flow (like every
# other one in this suite) keeps starting from `clearState: true` clean.
appId: ${APP_ID}
tags:
  - happy
---
# The permissions override MUST ride inside launchApp (proven
# empirically 2026-08-01, third iteration): Maestro's Android driver
# auto-grants every manifest runtime permission on EVERY launchApp —
# verified via dumpsys that a standalone setPermissions or a bare
# relaunch always ends granted=true again. Only a launch carrying the
# stanza applies `unset` as part of that launch. (`unset` itself matches
# a real fresh install, where the user has never been asked — the
# original 2026-07-31 root cause.)
- launchApp:
    clearState: true
    permissions:
      notifications: unset
# The stanza launch has an internal revoke-vs-start race: the permission
# change can kill the freshly-started process, intermittently leaving a
# permanently blank app on slow CI emulators (debug artifacts: white
# frame beyond 90s). Healthy path: the bounded wait below succeeds and
# the recovery is skipped. Race path: the wait times out (optional, so
# the flow continues), and the conditional relaunch restarts the app —
# WITH the stanza again (a bare launchApp would re-grant) and WITHOUT
# clearState (the cleared-fresh state must survive).
- extendedWaitUntil:
    visible:
      id: "onboarding.name"
    timeout: 60000
    optional: true
- runFlow:
    when:
      notVisible:
        id: "onboarding.name"
    commands:
      - launchApp:
          permissions:
            notifications: unset
# The authoritative first assert (README convention 8 cold-start wait).
- extendedWaitUntil:
    visible:
      id: "onboarding.name"
    timeout: 90000
- tapOn:
    id: "onboarding.name.set"
- assertVisible:
    id: "members.edit.name"
- tapOn:
    id: "members.edit.name"
- eraseText
- inputText: "Jordan"
- pressKey: Enter
- tapOn:
    id: "members.edit.save"
# Destination-only assert (README convention 4): the sheet's own name-field
# id is gone, proving it actually closed (matches the precedent in
# e2e/flows/settings/members_and_acting.yaml — a bare text lookup, or an
# element that stays in the hierarchy under the closing sheet's scrim,
# could false-positive mid-transition).
- assertNotVisible:
    id: "members.edit.name"
- assertNotVisible:
    id: "onboarding.name"
# Add the first chore: the digest pre-prompt banner only shows once a
# chore exists (spec: a fresh install shows the name banner first).
- tapOn:
    id: "chores.add"
- tapOn:
    id: "chore_form.title"
- inputText: "Water plants"
- pressKey: Enter
- tapOn:
    id: "chore_form.save"
- assertVisible: "(?s).*Water plants.*"
- assertVisible:
    id: "digest.preprompt"
- tapOn:
    id: "digest.preprompt.dismiss"
- assertNotVisible:
    id: "digest.preprompt"
# The renamed member's name persisted through the whole journey. Android
# merges the tappable row's descendants (avatar initial + name) into one
# label (README convention 2), hence the (?s).* wrapping.
- tapOn:
    id: "shell.tab.settings"
- tapOn:
    id: "settings.members"
- assertVisible: "(?s).*Jordan.*"
