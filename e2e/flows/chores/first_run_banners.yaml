# Welcome-create -> digest pre-prompt journey (spec
# docs/specs/onboarding-v2.md, docs/specs/polish-round-1.md A3): a fresh
# launch shows the welcome gate (the onboarding NAME BANNER is dead on
# arrival for this path -- the member's name is typed right there at
# creation, spec §1); adding the first chore then surfaces the digest
# pre-prompt banner (OS notification permission isn't granted yet on a
# freshly-cleared install), dismissed via its own action. The digest
# pre-prompt is still an inline banner card, never a modal, so this flow
# (like every other one in this suite) keeps starting from
# `clearState: true` clean.
appId: ${APP_ID}
tags:
  - happy
---
# The permissions override MUST ride inside launchApp (proven
# empirically 2026-08-01, third iteration): Maestro's Android driver
# auto-grants every manifest runtime permission on EVERY launchApp —
# verified via dumpsys that a standalone setPermissions or a bare
# relaunch always ends granted=true again. Only a launch carrying the
# stanza applies `unset` as part of that launch. (`unset` itself matches
# a real fresh install, where the user has never been asked — the
# original 2026-07-31 root cause.)
- launchApp:
    clearState: true
    permissions:
      notifications: unset
# The stanza launch has an internal revoke-vs-start race: the permission
# change can kill the freshly-started process, intermittently leaving a
# permanently blank app on slow CI emulators (debug artifacts: white
# frame beyond 90s). Healthy path: the bounded wait below succeeds and
# the recovery is skipped. Race path: the wait times out (optional, so
# the flow continues), and the conditional relaunch restarts the app —
# WITH the stanza again (a bare launchApp would re-grant) and WITHOUT
# clearState (the cleared-fresh state must survive). Targets the welcome
# gate's create card now (`welcome.create`), not the retired name banner
# (`onboarding.name`) -- a cold launch lands there first.
- extendedWaitUntil:
    visible:
      id: "welcome.create"
    timeout: 60000
    optional: true
- runFlow:
    when:
      notVisible:
        id: "welcome.create"
    commands:
      - launchApp:
          permissions:
            notifications: unset
# The authoritative first assert (README convention 8 cold-start wait).
- extendedWaitUntil:
    visible:
      id: "welcome.create"
    timeout: 90000
# Welcome-create names the sole admin member "Jordan" directly (spec §1:
# the member's name is typed right here, so the onboarding name banner
# never has anything left to prompt for) -- this is what the final assert
# below checks survived, in place of the old name-banner-then-rename dance.
- tapOn:
    id: "welcome.create"
- tapOn:
    id: "welcome.create.name"
- inputText: "Jordan"
# Enter IS the submit: the name field's onSubmitted runs the create
# action directly (good product UX), so the confirm button can unmount
# before a follow-up tap would land — never press Enter AND tap confirm.
- pressKey: Enter
- assertVisible:
    id: "shell.tab.chores"
- assertNotVisible:
    id: "welcome.create"
- assertNotVisible:
    id: "onboarding.name"
# Add the first chore: the digest pre-prompt banner only shows once a
# chore exists.
- tapOn:
    id: "chores.add"
- tapOn:
    id: "chore_form.title"
- inputText: "Water plants"
- pressKey: Enter
- tapOn:
    id: "chore_form.save"
- assertVisible: "(?s).*Water plants.*"
- assertVisible:
    id: "digest.preprompt"
- tapOn:
    id: "digest.preprompt.dismiss"
- assertNotVisible:
    id: "digest.preprompt"
# The welcome-create member's name persisted through the whole journey.
# Android merges the tappable row's descendants (avatar initial + name)
# into one label (README convention 2), hence the (?s).* wrapping.
- tapOn:
    id: "shell.tab.settings"
- tapOn:
    id: "settings.members"
- assertVisible: "(?s).*Jordan.*"
