# First-run banners journey (spec docs/specs/polish-round-1.md A2/A3):
# a fresh launch shows the name-prompt banner; setting a name via the
# EXISTING member edit sheet dismisses it; adding the first chore then
# surfaces the digest pre-prompt banner (OS notification permission isn't
# granted yet on a freshly-cleared install), dismissed via its own action.
# Both are inline banner cards, never modals, so this flow (like every
# other one in this suite) keeps starting from `clearState: true` clean.
appId: ${APP_ID}
tags:
  - happy
---
- launchApp:
    clearState: true
    # `notifications: unset` (root-caused 2026-07-31): Maestro's Android
    # driver silently auto-grants every manifest-declared runtime
    # permission on `launchApp` — including POST_NOTIFICATIONS — even
    # with `clearState: true`, unlike iOS (where the OS prompt still
    # appears and Maestro just auto-taps Allow). A real fresh install has
    # NOT been asked yet, so without this override
    # `notificationPermissionGrantedProvider` correctly resolves `true`
    # on Android (verified via `adb shell dumpsys package`: POST_NOTIFICATIONS
    # read `granted=true` immediately after a plain `clearState` launch)
    # and this assertion below fails — not a product bug, a
    # test-environment mismatch. `unset` leaves the permission genuinely
    # un-granted, matching a real fresh install on both platforms.
    permissions:
      notifications: unset
# extendedWaitUntil, not assertVisible (root-caused 2026-08-01, README
# "Cold starts"): this is the suite's only launchApp that BOTH clears
# state AND sets permissions — the coldest possible start (fresh ART
# verification, no warm caches) — and on CI emulators the first Flutter
# frame can land after the default element-wait window (observed ~30s
# via logcat while the default window expired at ~19s; the app itself
# is fine). The long wait covers exactly that first frame; every later
# step runs against a live app and keeps normal timeouts.
- extendedWaitUntil:
    visible:
      id: "onboarding.name"
    timeout: 90000
- tapOn:
    id: "onboarding.name.set"
- assertVisible:
    id: "members.edit.name"
- tapOn:
    id: "members.edit.name"
- eraseText
- inputText: "Jordan"
- pressKey: Enter
- tapOn:
    id: "members.edit.save"
# Destination-only assert (README convention 4): the sheet's own name-field
# id is gone, proving it actually closed (matches the precedent in
# e2e/flows/settings/members_and_acting.yaml — a bare text lookup, or an
# element that stays in the hierarchy under the closing sheet's scrim,
# could false-positive mid-transition).
- assertNotVisible:
    id: "members.edit.name"
- assertNotVisible:
    id: "onboarding.name"
# Add the first chore: the digest pre-prompt banner only shows once a
# chore exists (spec: a fresh install shows the name banner first).
- tapOn:
    id: "chores.add"
- tapOn:
    id: "chore_form.title"
- inputText: "Water plants"
- pressKey: Enter
- tapOn:
    id: "chore_form.save"
- assertVisible: "(?s).*Water plants.*"
- assertVisible:
    id: "digest.preprompt"
- tapOn:
    id: "digest.preprompt.dismiss"
- assertNotVisible:
    id: "digest.preprompt"
# The renamed member's name persisted through the whole journey. Android
# merges the tappable row's descendants (avatar initial + name) into one
# label (README convention 2), hence the (?s).* wrapping.
- tapOn:
    id: "shell.tab.settings"
- tapOn:
    id: "settings.members"
- assertVisible: "(?s).*Jordan.*"
