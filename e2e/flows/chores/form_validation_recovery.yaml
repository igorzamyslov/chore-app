# Error path + recovery: empty title is rejected inline; fixing it saves.
appId: ${APP_ID}
tags:
  - error
---
- launchApp:
    clearState: true
# First-frame settle (README convention 8): on slow CI machines the
# first frame after a clearState launch can lose the race against the
# first tap — wait for the welcome gate to exist before touching anything
# (a cold launch now lands there, spec docs/specs/onboarding-v2.md, not on
# the shell directly).
- extendedWaitUntil:
    visible:
      id: "welcome.create"
    timeout: 60000
- runFlow: ../../common/onboard_fresh.yaml
- tapOn:
    id: "chores.add"
- tapOn:
    id: "chore_form.save"
# Regex, not a bare string: the inline error and the field's own label
# merge into ONE accessibility node ("Title\nTitle is required" — verified
# in the captured hierarchy 2026-08-06), and Maestro matches node text
# exactly. That merge is deliberate and good for screen readers, which
# announce the error together with the field it belongs to, so the
# assertion adapts rather than the app. Same pattern as the title asserts
# below.
- assertVisible: "(?s).*Title is required.*"
# Recovery: the same form session must succeed after fixing the input.
- tapOn:
    id: "chore_form.title"
- inputText: "Take out trash"
- pressKey: Enter
- tapOn:
    id: "chore_form.save"
# Assert we actually LEFT the form: the FAB only exists on the list
# screen. (A bare text assert can spuriously match the form's own text
# field content — that exact false-positive happened once.)
- assertVisible:
    id: "chores.add"
- assertVisible: "(?s).*Take out trash.*"
