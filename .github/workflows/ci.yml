# Mirrors the lefthook pre-commit checks exactly — hooks are the fast local
# feedback, CI is the enforcement (hooks can be bypassed with --no-verify).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # PINNED, not floating `stable` (2026-08-13). An unpinned stable
          # silently moved past the SDK that generated pubspec.lock, and
          # `flutter pub get --enforce-lockfile` below started failing on
          # SDK-bundled packages (meta, test_api, vector_math) with no
          # commit having touched the lockfile. Same reasoning as the
          # Maestro pin in e2e.yml: a floating toolchain turns an unrelated
          # upstream release into a red build on someone else's PR. It also
          # makes the shipped release APK reproducible. Bump deliberately,
          # together with a regenerated pubspec.lock.
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze --fatal-infos --fatal-warnings
      # SUPABASE_* defines empty: keeps `supabaseConfigured` false for the
      # whole suite (see lefthook.yml's `test` job for why this is
      # required, not just tidy).
      - run: flutter test --dart-define=SUPABASE_URL= --dart-define=SUPABASE_ANON_KEY=
