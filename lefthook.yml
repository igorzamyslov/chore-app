# Git hooks via lefthook (https://lefthook.dev)
# Install once per clone: `lefthook install`
#
# Philosophy: maximum strictness, fail fast. Formatting, analysis (infos are
# fatal), and the full test suite all run before a commit is accepted.
# If the test suite ever grows slow enough to hurt, move the `test` job to
# pre-push — don't loosen it.

pre-commit:
  # NOT parallel: analyze/test/pub-get all contend for Flutter's global
  # startup lock, and parallel runs failed flakily on it (a job dies
  # instead of waiting). Sequential costs ~10s and never flakes.
  parallel: false
  jobs:
    - name: format
      glob: "*.dart"
      # Formats staged files in place and re-stages them; fails the commit
      # only if formatting produced changes that couldn't be auto-applied.
      #
      # `check_formatter_config.sh &&` is a GUARD, and it has to run *before*
      # the format, never after: in a fresh `git worktree` there is no
      # `.dart_tool/`, so `dart format` cannot resolve the `package:` include
      # in analysis_options.yaml, warns on stderr only, still exits 0, and
      # falls back to `trailing_commas: automate` — stripping trailing commas
      # and rejoining multi-line calls in everything it touches. Because
      # `preserve` is stable on `automate`'s output, `--set-exit-if-changed`
      # then PASSES on that churn, so no after-the-fact check (this job's own,
      # or ci.yml's) can catch it. See the script and backlog A-7.
      #
      # Prefixed into this job's own command rather than added as an earlier
      # job on purpose: `&&` cannot run out of order and cannot be skipped,
      # whereas a separate job would depend on lefthook's ordering and
      # fail-fast semantics.
      run: tool/check_formatter_config.sh && dart format --set-exit-if-changed {staged_files}
      stage_fixed: true

    - name: analyze
      # `env -u GIT_DIR -u GIT_INDEX_FILE`: git sets these for hook
      # subprocesses so *its own* git commands touch the right worktree/index,
      # but Flutter's tool shells out to git too (to read its own SDK's
      # version) and inherits them unchanged — GIT_DIR then points this repo's
      # git at Flutter's SDK checkout, so the version read comes back
      # 0.0.0-unknown and `permission_handler`'s `>=3.24.0` Flutter-SDK
      # constraint fails to resolve. Unset both before invoking flutter/dart.
      run: env -u GIT_DIR -u GIT_INDEX_FILE flutter analyze --fatal-infos --fatal-warnings

    - name: test
      # Both SUPABASE_* defines explicitly empty: `supabaseConfigured`
      # (lib/app/supabase_config.dart) must be false for the whole suite,
      # since `AppShell`'s `IndexedStack` builds the Settings tab's Account
      # section (lib/features/settings/account_section.dart) for every
      # single widget test regardless of which tab it navigates to — with
      # Supabase "configured" but never `Supabase.initialize()`d (as in
      # every test), `authGatewayProvider`'s default branch would construct
      # a live `SupabaseAuthGateway` against an uninitialized client and
      # crash the entire suite the moment it's watched.
      run: env -u GIT_DIR -u GIT_INDEX_FILE flutter test --dart-define=SUPABASE_URL= --dart-define=SUPABASE_ANON_KEY=

    - name: pubspec-lock-in-sync
      # Catches "edited pubspec.yaml but forgot pub get" drift.
      run: env -u GIT_DIR -u GIT_INDEX_FILE dart pub get --enforce-lockfile --offline

pre-push:
  jobs:
    - name: full-test-suite
      # See the pre-commit `test` job above for why these defines are
      # required.
      run: env -u GIT_DIR -u GIT_INDEX_FILE flutter test --dart-define=SUPABASE_URL= --dart-define=SUPABASE_ANON_KEY=
